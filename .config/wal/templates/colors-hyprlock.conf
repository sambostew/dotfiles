# pywal -> hyprlock palette (rendered to ~/.cache/wal/colors-hyprlock.conf).
# Keep the lock screen aligned with Waybar/Rofi: black glass, pywal foreground,
# color3 accent, and color1 for authentication failures.
$wal-fg = rgba({foreground.strip}ff)
$wal-dim = rgba({color8.strip}ff)
$wal-accent = rgba({color3.strip}ff)
$wal-accent-soft = rgba({color3.strip}80)
$wal-urgent = rgba({color1.strip}ff)
