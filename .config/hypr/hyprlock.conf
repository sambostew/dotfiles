source = ~/.cache/wal/colors-hyprlock.conf

$font = UbuntuMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 3000
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldColors, 1, 6, smooth
}

background {
    monitor =
    path = ~/Pictures/godmode.jpg
}

input-field {
    monitor =
    size = 380, 55
    outline_thickness = 3
    inner_color = rgba(000000b3)
    outer_color = $wal-accent-soft
    check_color = $wal-accent
    fail_color = $wal-urgent
    capslock_color = $wal-urgent
    font_color = $wal-fg
    font_family = $font
    rounding = 12
    placeholder_text = <i>Password...</i>
    fail_text = $PAMFAIL
    check_text = Authenticating...
    dots_spacing = 0.25
    dots_size = 0.3
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
}

label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = $font
    color = $wal-fg
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(000000cc)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color = $wal-dim
    position = 0, 95
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[US]
    font_size = 14
    font_family = $font
    color = $wal-dim
    position = 0, -95
    halign = center
    valign = center
}
