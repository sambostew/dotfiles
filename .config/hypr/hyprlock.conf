source = ~/.cache/wal/colors-hyprlock.conf

$font = UbuntuMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 3000
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldColors, 1, 7, smooth
}

background {
    monitor =
    path = ~/Pictures/godmode.jpg
    blur_passes = 4
    blur_size = 8
    brightness = 0.55
    contrast = 0.9
    noise = 0.012
    vibrancy = 0.1
}

# Dark glass panel matching Waybar's fixed black base.
shape {
    monitor =
    size = 560, 390
    rounding = 24
    color = $wal-card
    border_size = 1
    border_color = $wal-accent-soft
    position = 0, -10
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(00000099)
    zindex = -1
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = $font
    color = $wal-fg
    position = 0, 108
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(000000cc)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 19
    font_family = $font
    color = $wal-dim
    position = 0, 58
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>SESSION LOCKED</b>
    font_size = 14
    font_family = $font
    color = $wal-accent
    position = 0, -132
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 390, 58
    outline_thickness = 2
    inner_color = $wal-card-soft
    outer_color = $wal-accent
    check_color = $wal-accent
    fail_color = $wal-urgent
    capslock_color = $wal-urgent
    font_color = $wal-fg
    font_family = $font
    rounding = 14
    placeholder_text = <i>Enter password</i>
    check_text = Authenticating...
    fail_text = $PAMFAIL
    dots_size = 0.28
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -35
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(000000cc)
}

label {
    monitor =
    text = Type your password to unlock
    font_size = 14
    font_family = $font
    color = $wal-dim
    position = 0, -100
    halign = center
    valign = center
}
